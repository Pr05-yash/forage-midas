# Kafka consumer retry aur timeout settings
spring.kafka.consumer.properties.session.timeout.ms=60000
spring.kafka.consumer.properties.request.timeout.ms=60000
spring.kafka.consumer.properties.group.initial.rebalance.delay.ms=10000

# Producer settings (jo aapke log mein dikh raha tha)
spring.kafka.producer.properties.delivery.timeout.ms=60000
spring.kafka.producer.properties.request.timeout.ms=30000
